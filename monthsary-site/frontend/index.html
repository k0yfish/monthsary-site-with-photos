<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf1ea">
<title>Happy 4th Monthsary 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="nav">
  <a href="#home">Home</a><a href="#letter">Letter</a><a href="#gallery">Memories</a><a href="#notes">Notes</a>
</nav>

<header id="home" class="hero">
  <div class="hearts" aria-hidden="true" id="hearts"></div>
  <div class="hero-content">
    <h1 id="heroHeading"></h1>
    <p class="tagline" id="heroTagline"></p>
  </div>
  <div class="ticker" id="ticker"></div>
  <div class="btn-wrap"><a class="btn" href="#letter" id="ctaBtn"></a></div>
</header>

<section id="letter" class="center">
  <h2 class="title">Sulat para sa aking minamahal</h2>
  <p class="subtitle">Flip me</p>
  <div class="letter-scene">
    <div class="letter-card">
      <div class="letter-inner" id="letterInner">
        <div class="page page1" id="page1"></div>
        <div class="page page2" id="page2"></div>
      </div>
    </div>
    <div class="letter-controls">
      <button id="prevBtn" type="button">Previous</button>
      <button id="nextBtn" type="button">Next</button>
    </div>
  </div>
</section>

<section id="gallery" class="center">
  <h2 class="title">Memories</h2>
  <p class="subtitle">Favorite pics ta</p>
  <div class="grid" id="galleryGrid"></div>
</section>

<section id="notes" class="center">
  <h2 class="title">Leave Me a Little Note</h2>
  <p class="subtitle">Surat mo digdi mga gusto mong sabihon sako.</p>
  <form class="note-form" id="noteForm">
    <input type="text" id="noteName" placeholder="Your name" aria-label="Your name" maxlength="40">
    <textarea id="noteText" placeholder="Type your note..." aria-label="Your note" maxlength="500" required></textarea>
    <button type="submit" class="btn">Send</button>
  </form>
  <div class="notes-list" id="notesList" aria-live="polite"></div>
</section>

<footer>🤍</footer>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
